server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: technova-it-helpdesk

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/TechNovaTest}
    username: ${SPRING_DATASOURCE_USERNAME:tu_usuario_postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:tu_clave_postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

security:
  jwt:
    # Clave de 256 bits generada de forma segura para HMAC-SHA256 (Base64 o Hex)
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # Tiempo de expiración en milisegundos (24 horas = 86400000 ms)
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
