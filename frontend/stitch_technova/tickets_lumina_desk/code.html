<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Gestión de Tickets • TechNova IT Helpdesk</title>

  <!-- Tipografía Plus Jakarta Sans y Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

  <!-- Tailwind CSS & Lumina Theme -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="../../js/tailwind-theme.js"></script>
  <link rel="stylesheet" href="../../css/lumina-theme.css">
</head>
<body class="bg-surface-container-lowest font-body text-slate-800 antialiased lumina-bg">

  <main class="w-full pl-64 pt-16 min-h-screen">
    <div class="px-8 py-8 flex flex-col gap-6 max-w-7xl mx-auto w-full">

      <!-- Cabecera de la Página -->
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div class="flex flex-col gap-1.5">
          <div class="flex items-center gap-2">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-primary/10 text-primary text-xs font-semibold">
              <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
              Cola Operativa
            </span>
            <span class="text-xs text-slate-500 font-medium">Mesa de Ayuda Integral</span>
          </div>
          <h1 class="text-2xl lg:text-3xl font-bold text-slate-900 tracking-tight">Tickets de Soporte</h1>
          <p id="tickets-scope-subtitle" class="text-xs text-slate-500">
            Supervisión integral de todas las incidencias registradas en TechNova Solutions.
          </p>
        </div>

        <div class="flex items-center gap-3">
          <button id="btn-open-create-modal" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-primary hover:bg-primary-container text-white font-semibold text-xs shadow-md transition-all active:scale-[0.98]">
            <span class="material-symbols-outlined text-[18px]">add</span>
            <span>Nuevo Ticket</span>
          </button>
        </div>
      </div>

      <!-- Barra de Filtros Multicriterio -->
      <section class="bg-white rounded-2xl p-5 border border-slate-200/70 shadow-sm">
        <form id="filters-form" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
          
          <!-- Búsqueda por texto -->
          <div class="md:col-span-4 flex flex-col gap-1.5">
            <label class="text-xs font-bold text-slate-700" for="filter-q">Buscar</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none">search</span>
              <input id="filter-q" name="q" class="w-full pl-9 pr-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white transition-all" placeholder="Código, título, solicitante o técnico..." type="search">
            </div>
          </div>

          <!-- Filtro por Estado -->
          <div class="md:col-span-2 flex flex-col gap-1.5">
            <label class="text-xs font-bold text-slate-700" for="filter-status">Estado</label>
            <select id="filter-status" name="status" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white cursor-pointer transition-all">
              <option value="">Todos los estados</option>
              <option value="ABIERTA">Abierta</option>
              <option value="ASIGNADA">Asignada</option>
              <option value="EN_PROCESO">En Proceso</option>
              <option value="RESUELTA">Resuelta</option>
              <option value="CERRADA">Cerrada</option>
            </select>
          </div>

          <!-- Filtro por Prioridad -->
          <div class="md:col-span-2 flex flex-col gap-1.5">
            <label class="text-xs font-bold text-slate-700" for="filter-priority">Prioridad</label>
            <select id="filter-priority" name="priorityId" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white cursor-pointer transition-all">
              <option value="">Todas las prioridades</option>
            </select>
          </div>

          <!-- Filtro por Categoría -->
          <div class="md:col-span-2 flex flex-col gap-1.5">
            <label class="text-xs font-bold text-slate-700" for="filter-category">Categoría</label>
            <select id="filter-category" name="categoryId" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white cursor-pointer transition-all">
              <option value="">Todas las categorías</option>
            </select>
          </div>

          <!-- Limpiar filtros -->
          <div class="md:col-span-2 flex items-center justify-end">
            <button id="btn-clear-filters" type="button" class="w-full md:w-auto px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl transition-all">
              Limpiar filtros
            </button>
          </div>

        </form>
      </section>

      <!-- Tabla de Datos -->
      <section class="bg-white rounded-2xl border border-slate-200/70 shadow-sm overflow-hidden flex flex-col">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead class="bg-slate-50/70 border-b border-slate-100 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
              <tr>
                <th class="py-3.5 px-4 whitespace-nowrap">Código</th>
                <th class="py-3.5 px-4 whitespace-nowrap">Título</th>
                <th class="py-3.5 px-4 whitespace-nowrap">Categoría</th>
                <th class="py-3.5 px-4 whitespace-nowrap">Prioridad</th>
                <th class="py-3.5 px-4 whitespace-nowrap">Estado</th>
                <th class="py-3.5 px-4 whitespace-nowrap">Solicitante</th>
                <th class="py-3.5 px-4 whitespace-nowrap">Técnico Asignado</th>
                <th class="py-3.5 px-4 whitespace-nowrap">Límite SLA</th>
                <th class="py-3.5 px-4 whitespace-nowrap">Últ. Actualización</th>
              </tr>
            </thead>
            <tbody id="tickets-table-body" class="divide-y divide-slate-100 text-xs text-slate-700">
              <!-- Renderizado dinámico -->
            </tbody>
          </table>
        </div>

        <!-- Footer Contador -->
        <div class="p-3.5 bg-slate-50/50 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
          <span id="tickets-count-label">Cargando incidencias...</span>
        </div>
      </section>

    </div>
  </main>

  <script type="module" src="../../js/pages/tickets.js"></script>
</body>
</html>
